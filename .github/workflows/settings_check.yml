name: Check repository settings

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover repositories
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.list.outputs.repositories }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Discover public repositories
        id: list
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Emit owner/repo (.full_name) one per line, excluding forks/archived/private
          gh api --paginate 'users/carstencodes/repos?per_page=100&type=owner&sort=full_name' \
            --jq '.[] | select(.visibility == "public" and (.fork | not) and (.archived | not)) | .full_name' \
            > repo-names.txt || true

          # Initialize empty ignore list if file doesn't exist
          if [[ -f .settings/.settingsignore ]]; then
            ignore_patterns=$(grep -v '^#' .settings/.settingsignore | grep -v '^[[:space:]]*$' || true)
          else
            echo "Warning: .settings/.settingsignore not found, proceeding without exclusions" >&2
            ignore_patterns=""
          fi

          # Filter out repos matching ignore patterns (glob where * matches any substring)
          # Output directly to file (don't capture in $() simultaneously)
          while IFS= read -r repo; do
            match=false
            while IFS= read -r pattern; do
              [[ -z "$pattern" ]] && continue
              # Convert glob pattern to regex (* -> .*)
              regex_pattern="^${pattern//\*/.*}$"
              if [[ "$repo" =~ $regex_pattern ]]; then
                match=true
                break
              fi
            done <<< "$ignore_patterns"
            if ! $match; then
              echo "$repo"
            fi
          done < repo-names.txt > filtered-repos.txt

          # Build a JSON array from newline-separated owner/repo strings
          matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' filtered-repos.txt)
          echo "repositories=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    name: Check repository settings
    if: needs.discover.outputs.repositories != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # matrix.repository will be "owner/repo"
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Require repository settings file
        run: |
          # matrix.repository is owner/repo (e.g. carstencodes/my-repo)
          REPOSITORY_FULL='${{ matrix.repository }}'
          REPOSITORY_NAME="${REPOSITORY_FULL##*/}"   # strip owner/
          test -f ".settings/repository/${REPOSITORY_NAME}.yaml" || {
            echo "::error::Missing .settings/repository/${REPOSITORY_NAME}.yaml for discovered repository ${REPOSITORY_FULL}"
            exit 1
          }

      - name: Merge general + repository settings into single YAML (using yq)
        run: |
          REPOSITORY_FULL='${{ matrix.repository }}'
          REPOSITORY_NAME="${REPOSITORY_FULL##*/}"   # plain repo name to find file
          MERGED="${{ runner.temp }}/settings.yml"

          if [ -f ".settings/general.yaml" ] && [ -f ".settings/repository/${REPOSITORY_NAME}.yaml" ]; then
            yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' .settings/general.yaml .settings/repository/${REPOSITORY_NAME}.yaml > "$MERGED"
          elif [ -f ".settings/repository/${REPOSITORY_NAME}.yaml" ]; then
            cp .settings/repository/${REPOSITORY_NAME}.yaml "$MERGED"
          elif [ -f ".settings/general.yaml" ]; then
            cp .settings/general.yaml "$MERGED"
          else
            echo "::error::No settings file found (neither .settings/general.yaml nor .settings/repository/${REPOSITORY_NAME}.yaml)"
            exit 1
          fi

          echo "Merged settings written to $MERGED"
          echo "----- merged preview -----"
          head -n 200 "$MERGED" || true

      - name: Check repository settings
        uses: Vivswan/github-settings-as-code@v2
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          mode: check
          # pass single scalar owner/repo (no owner: field). Quoted to avoid YAML splitting.
          repository: "${{ matrix.repository }}"
          settings-file: ${{ runner.temp }}/settings.yml
