name: Check repository settings

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.list.outputs.repositories }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover public repositories
        id: list
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          repositories="$(gh api --paginate 'users/carstencodes/repos?per_page=100&type=owner&sort=full_name' \
            | jq -r '.[] | select(.visibility == "public" and (.fork | not) and (.archived | not)) | .name')"

          ignore_file=".settings/.settingsignore"
          if [ -f "$ignore_file" ]; then
            while IFS= read -r pattern; do
              pattern="${pattern%%#*}"
              pattern="${pattern#"${pattern%%[![:space:]]*}"}"
              pattern="${pattern%"${pattern##*[![:space:]]}"}"
              [ -z "$pattern" ] && continue

              repositories="$(printf '%s\n' "$repositories" | while IFS= read -r repo; do
                case "$repo" in
                  $pattern) continue ;;
                esac
                printf '%s\n' "$repo"
              done)"
            done < "$ignore_file"
          fi

          matrix="$(printf '%s\n' "$repositories" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "repositories=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.repositories != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    steps:
      - uses: actions/checkout@v7

      - name: Require repository settings file
        run: |
          if [ ! -f ".settings/repository/${{ matrix.repository }}.yaml" ]; then
            echo "::error::Missing .settings/repository/${{ matrix.repository }}.yaml for discovered repository carstencodes/${{ matrix.repository }}"
            exit 1
          fi

      - name: Render shared and repository settings
        run: |
          mkdir -p "$(dirname "${{ runner.temp }}/settings.yml")"
          # Add a YAML document separator between files to be safe:
          (cat .settings/general.yaml; echo; echo '---'; cat .settings/repository/${{ matrix.repository }}.yaml) > "${{ runner.temp }}/settings.yml"

      - name: Check repository settings
        uses: Vivswan/github-settings-as-code@v2
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          mode: check
          repository: carstencodes/${{ matrix.repository }}
          settings-file: ${{ runner.temp }}/settings.yml
