name: Check repository settings

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.list.outputs.repositories }}
    steps:
      - name: Discover public repositories
        id: list
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # List repositories and extract only the repository name (no owner, no objects)
          gh api --paginate 'users/carstencodes/repos?per_page=100&type=owner&sort=full_name' \
            --jq -r '.[] | select(.visibility == "public" and (.fork | not) and (.archived | not)) | .name' \
            > repo-names.txt || true

          # Build a JSON array from the newline-separated names
          matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' repo-names.txt)
          echo "repositories=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.repositories != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    steps:
      - uses: actions/checkout@v7

      - name: Require repository settings file
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          test -f ".settings/repository/${REPOSITORY}.yaml" || {
            echo "::error::Missing .settings/repository/${REPOSITORY}.yaml for discovered repository carstencodes/${REPOSITORY}"
            exit 1
          }

      - name: Merge general + repository settings into single YAML (using yq)
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          MERGED="${{ runner.temp }}/settings.yml"
          if [ -f ".settings/general.yaml" ] && [ -f ".settings/repository/${REPOSITORY}.yaml" ]; then
            yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' .settings/general.yaml .settings/repository/${REPOSITORY}.yaml > "$MERGED"
          elif [ -f ".settings/repository/${REPOSITORY}.yaml" ]; then
            cp .settings/repository/${REPOSITORY}.yaml "$MERGED"
          elif [ -f ".settings/general.yaml" ]; then
            cp .settings/general.yaml "$MERGED"
          else
            echo "::error::No settings file found (neither .settings/general.yaml nor .settings/repository/${REPOSITORY}.yaml)"
            exit 1
          fi
          echo "Merged settings written to $MERGED"
          echo "----- merged preview -----"
          head -n 200 "$MERGED" || true

      - name: Debug: show repository being checked
        run: |
          echo "Checking repository: carstencodes/${{ matrix.repository }}"

      - name: Check repository settings
        uses: Vivswan/github-settings-as-code@v2
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          mode: check
          owner: carstencodes
          repository: ${{ matrix.repository }}
          settings-file: ${{ runner.temp }}/settings.yml
