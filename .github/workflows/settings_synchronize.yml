name: Synchronize repository settings

on:
  push:
    branches: [main]
    paths:
      - ".settings/**"
      - ".github/workflows/synchronize-settings.yml"
      - ".github/workflows/check-settings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    name: Discover repos to synchronize
    outputs:
      repositories: ${{ steps.list.outputs.repositories }}
    steps:
      - name: Discover public repositories
        id: list
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Emit owner/repo (.full_name) one per line, excluding forks/archived/private
          gh api --paginate 'users/${{ github.repository_owner }}/repos?per_page=100&type=owner&sort=full_name' \
            --jq '.[] | select(.visibility == "public" and (.fork | not) and (.archived | not)) | .full_name' \
            > repo-names.txt || true

          # Initialize empty ignore list if file doesn't exist
          if [[ -f .settings/.settingsignore ]]; then
            ignore_patterns=$(grep -v '^#' .settings/.settingsignore | grep -v '^[[:space:]]*$' || true)
          else
            echo "Warning: .settings/.settingsignore not found, proceeding without exclusions" >&2
            ignore_patterns=""
          fi

          # Filter out repos matching ignore patterns (glob where * matches any substring)
          # Output directly to file (don't capture in $() simultaneously)
          while IFS= read -r repo; do
            repo_name="${repo##*/}"
            match=false
            while IFS= read -r pattern; do
              [[ -z "$pattern" ]] && continue
              # Convert glob pattern to regex (* -> .*)
              regex_pattern="^${pattern//\*/.*}$"
              if [[ "$repo_name" =~ $regex_pattern ]]; then
                match=true
                break
              fi
            done <<< "$ignore_patterns"
            if ! $match; then
              echo "$repo"
            fi
          done < repo-names.txt > filtered-repos.txt

          # Build a JSON array from newline-separated owner/repo strings
          matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' filtered-repos.txt)
          echo "repositories=$matrix" >> "$GITHUB_OUTPUT"

  synchronize:
    needs: discover
    name: Synchronize settings
    if: needs.discover.outputs.repositories != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require repository settings file
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          test -f ".settings/repository/${REPOSITORY}.yaml" || {
            echo "::error::Missing .settings/repository/${REPOSITORY}.yaml for discovered repository carstencodes/${REPOSITORY}"
            exit 1
          }

      - name: Merge general + repository settings into single YAML (using yq)
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          MERGED="${{ runner.temp }}/settings.yml"
          # yq is expected to be available on the runner image
          if [ -f ".settings/general.yaml" ] && [ -f ".settings/repository/${REPOSITORY}.yaml" ]; then
            # deep-merge: general.yaml * repo.yaml (repo overrides)
            yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' .settings/general.yaml .settings/repository/${REPOSITORY}.yaml > "$MERGED"
          elif [ -f ".settings/repository/${REPOSITORY}.yaml" ]; then
            cp .settings/repository/${REPOSITORY}.yaml "$MERGED"
          elif [ -f ".settings/general.yaml" ]; then
            cp .settings/general.yaml "$MERGED"
          else
            echo "::error::No settings file found (neither .settings/general.yaml nor .settings/repository/${REPOSITORY}.yaml)"
            exit 1
          fi
          echo "Merged settings written to $MERGED"
          echo "----- merged preview -----"
          head -n 200 "$MERGED" || true

      - name: Apply repository settings
        uses: Vivswan/github-settings-as-code@v2
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          repository: carstencodes/${{ matrix.repository }}
          settings-file: ${{ runner.temp }}/settings.yml
